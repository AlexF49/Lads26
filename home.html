<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Lads 2026</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛳</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <header class="header">
      <img src="img/emblem.png" alt="" class="header__emblem-badge" />
      <h1 class="header__title">Lads 2026</h1>
      <p class="header__subtitle" id="playing-as"></p>
    </header>

    <section id="team-scores" class="team-scores"></section>

    <div class="sponsor-strip">
      <div class="sponsor-logo"><img src="img/sponsor-guinness.svg" alt="Guinness" /></div>
      <div class="sponsor-logo"><img src="img/sponsor-rolex.png" alt="Rolex" /></div>
      <div class="sponsor-logo"><img src="img/sponsor-lanacane.png" alt="Lanacane" /></div>
    </div>

    <div class="lb-tabs">
      <button type="button" class="lb-tab lb-tab--active" data-tab="match-centre">Match Centre</button>
      <button type="button" class="lb-tab" data-tab="information">Information</button>
    </div>

    <nav class="tiles" id="tiles-match-centre"></nav>
    <nav class="tiles" id="tiles-information" hidden></nav>
  </div>

  <script type="module" src="js/home.js"></script>
</body>
</html>
