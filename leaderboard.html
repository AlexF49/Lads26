<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Lads 2026</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛳</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <div class="page-header-row">
      <img src="img/emblem.jpg" alt="" class="page-emblem" />
      <a href="home.html" class="back-link">&larr; Home</a>
    </div>
    <header class="header">
      <h1 class="header__title">🏆 Leaderboard</h1>
      <p class="header__subtitle" id="updated-at"></p>
    </header>

    <p id="status" class="status"></p>

    <div class="lb-tabs">
      <button type="button" class="lb-tab lb-tab--active" data-tab="team">Team</button>
      <button type="button" class="lb-tab" data-tab="individual">Individual</button>
      <button type="button" class="lb-tab" data-tab="predictor">Predictor</button>
    </div>

    <section id="team-tab" class="lb-panel"></section>
    <section id="individual-tab" class="lb-panel" hidden></section>
    <section id="predictor-tab" class="lb-panel" hidden></section>
  </div>

  <script type="module" src="js/leaderboard.js"></script>
</body>
</html>
