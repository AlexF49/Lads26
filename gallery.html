<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Lads 2026</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛳</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <a href="home.html" class="back-link">&larr; Home</a>
    <header class="header">
      <h1 class="header__title">📷 Gallery</h1>
    </header>

    <p id="status" class="status"></p>

    <button type="button" id="upload-btn" class="save-btn">+ Upload Photos</button>
    <input type="file" id="file-input" accept="image/*" multiple hidden />

    <div id="gallery-grid" class="gallery-grid"></div>
  </div>

  <div id="lightbox" class="lightbox" hidden>
    <img id="lightbox-img" class="lightbox__img" src="" alt="" />
  </div>

  <script type="module" src="js/gallery.js"></script>
</body>
</html>
