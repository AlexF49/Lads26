<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Lads 2026</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛳</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/reload-on-bfcache.js"></script>
</head>
<body>
  <div class="page">
    <a href="home.html" class="back-link">&larr; Home</a>
    <header class="header">
      <img src="img/emblem.png" alt="" class="header__emblem-badge" />
      <h1 class="header__title">📖 Rules</h1>
    </header>

    <div id="format-row" class="bio-players"></div>

    <section id="rules-content" hidden></section>
  </div>

  <div id="rules-modal-backdrop" class="modal-backdrop" hidden>
    <div class="modal">
      <h2 class="modal__title">Edit <span id="rules-modal-format-name"></span></h2>
      <form id="rules-form">
        <label class="modal__label">
          Explanation (one point per line)
          <textarea id="rules-explanation-textarea" rows="6"></textarea>
        </label>
        <label class="modal__label">
          Scoring (one point per line)
          <textarea id="rules-scoring-textarea" rows="4"></textarea>
        </label>
        <p id="rules-modal-error" class="modal__error" hidden></p>
        <div class="modal__actions">
          <button type="button" id="rules-cancel-btn" class="change-btn">Cancel</button>
          <button type="submit" class="save-btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/rules.js"></script>
</body>
</html>
