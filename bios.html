<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Lads 2026</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛳</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <a href="home.html" class="back-link">&larr; Home</a>
    <header class="header">
      <img src="img/emblem.png" alt="" class="header__emblem-badge" />
      <h1 class="header__title">🧑‍🤝‍🧑 Player Bios</h1>
    </header>

    <p id="status" class="status"></p>

    <div class="lb-tabs" id="team-tabs"></div>

    <div id="players-row" class="bio-players"></div>

    <section id="bio-card" class="bio-card" hidden></section>
  </div>

  <div id="bio-modal-backdrop" class="modal-backdrop" hidden>
    <div class="modal">
      <h2 class="modal__title">Update Bio</h2>
      <form id="bio-form">
        <label class="modal__label">
          Bio text
          <textarea id="bio-textarea" rows="6" placeholder="Paste bio text here"></textarea>
        </label>
        <p id="bio-modal-error" class="modal__error" hidden></p>
        <div class="modal__actions">
          <button type="button" id="bio-cancel-btn" class="change-btn">Cancel</button>
          <button type="submit" class="save-btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/bios.js"></script>
</body>
</html>
