<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Lads 2026</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛳</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <div class="page-header-row">
      <img src="img/emblem.jpg" alt="" class="page-emblem" />
      <a href="home.html" class="back-link">&larr; Home</a>
    </div>
    <header class="header">
      <h1 class="header__title">🔧 Admin</h1>
    </header>

    <p id="status" class="status"></p>

    <h2 class="admin-section-title">Players</h2>
    <div class="expenses-table-wrap">
      <table class="expenses-table" id="players-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Team</th>
            <th>Seed</th>
            <th>Core Hcp</th>
            <th>Day 1</th>
            <th>Day 2</th>
            <th>Day 3</th>
          </tr>
        </thead>
        <tbody id="players-body"></tbody>
      </table>
    </div>

    <h2 class="admin-section-title">Bonus Points</h2>
    <div class="expenses-table-wrap">
      <table class="expenses-table" id="bonus-table">
        <thead>
          <tr>
            <th>Bonus</th>
            <th>Day 1</th>
            <th>Day 2</th>
            <th>Day 3</th>
          </tr>
        </thead>
        <tbody id="bonus-body"></tbody>
      </table>
    </div>
  </div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
